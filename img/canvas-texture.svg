<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <filter id="paint" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".025 .19" numOctaves="3" seed="12" stitchTiles="stitch" result="pigment"/>
    <feDiffuseLighting in="pigment" surfaceScale="2" diffuseConstant="1" lighting-color="#fff">
      <feDistantLight azimuth="225" elevation="50"/>
    </feDiffuseLighting>
  </filter>
  <rect width="100%" height="100%" filter="url(#paint)"/>
</svg>
